[package]
name = "montaje"
version = "0.1.0"
edition = "2021"
description = "Editor de video rápido controlado por IA (CLI + servidor MCP)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rustfft = "6"
base64 = "0.22"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
eframe = { version = "0.35", optional = true }
cpal = { version = "0.18", optional = true }

[features]
default = ["whisper", "studio"]
# Editor visual (ventana nativa con audio, forma de onda y ajuste por fotogramas)
studio = ["dep:eframe", "dep:cpal"]
# Transcripción local con Whisper en Rust puro (candle)
whisper = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[profile.dev]
opt-level = 2
